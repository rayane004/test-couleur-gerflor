<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test Farnsworth - GERFLOR</title>

<style>

/* GLOBAL */
body {
  margin: 0;
  font-family: "Segoe UI", Arial;
  background: linear-gradient(135deg, #f5f7fa, #cfd9df);
}

/* HEADER */

header {
  background: linear-gradient(90deg, #002b5c, #0051a8);
  color: white;
  text-align: center;
  padding: 25px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

header h1 {
  margin: 0;
  font-size: 26px;
  letter-spacing: 0.5px;
}

/* CONTAINER */
.container {
  max-width: 1100px;
  margin: 40px auto;
}

/* CARD */
.card {
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* TEXT */
.description {
  text-align: center;
  margin-bottom: 25px;
  color: #444;
  line-height: 1.5;
}

/* ROW */
.row {
  display: flex;
  justify-content: center;
  margin: 12px 0;
}

/* COLORS */
.color {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  margin: 4px;
  cursor: grab;
  transition: 0.2s;
}

.color:hover {
  transform: scale(1.15);
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.fixed {
  border: 3px solid black;
  cursor: default;
}

/* FORM */
.form {
  text-align: center;
  margin-top: 20px;
}

input, select {
  padding: 12px;
  margin: 6px;
  border-radius: 10px;
  border: 1px solid #ccc;
  width: 220px;
  font-size: 14px;
  transition: 0.2s;
}

input:focus, select:focus {
  border-color: #0073e6;
  outline: none;
}

/* BUTTON */
button {
  margin-top: 20px;
  padding: 14px 35px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #002b5c, #0073e6);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: linear-gradient(90deg, #0073e6, #00aaff);
  transform: translateY(-3px);
}

/* RESULT */
#result {
  margin-top: 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

</style>
</head>

<body>
  


<header>
  <h1>Test de perception des couleurs</h1>
  <p style="font-size:14px; opacity:0.8;">
    Service Qualité - Gerflor
  </p>
</header>


  
<div class="container">
<div class="card">

<p class="description">
Ce test permet d’évaluer votre capacité à distinguer les nuances de couleurs.<br>
Veuillez replacer les pastilles pour reconstituer un dégradé progressif.
</p>

<div id="test"></div>

<div class="form">

  <p><strong>Lieu du test :</strong></p>

  <select id="lieu">
    <option value="">-- Sélectionner un site --</option>
    <option value="Grillon">Grillon</option>
    <option value="Saint-Paul-3-Châteaux">Saint-Paul-3-Châteaux</option>
  </select>

  <br><br>

  <input id="nom" placeholder="Nom">
  <input id="prenom" placeholder="Prénom">

</div>

<div style="text-align:center;">
  <button onclick="check()">Valider le test</button>
</div>

<div id="result"></div>

</div>
</div>

<script>

let rowsData = [];
let dragged;
let lastScore = 0;

let testDiv = document.getElementById("test");

let starts = [0, 72, 144, 216, 288];

function createRow(startHue) {

  let row = document.createElement("div");
  row.className = "row";

  let hues = [];

  for (let i = 0; i < 20; i++) {
    hues.push((startHue + i * 3) % 360);
  }

  let first = hues[0];
  let last = hues[hues.length - 1];

  let middle = hues.slice(1, -1).sort(() => Math.random() - 0.5);

  function createColor(hue, fixed = false) {

    let div = document.createElement("div");
    div.className = "color";

    if (fixed) div.classList.add("fixed");

    div.style.background = `hsl(${hue},100%,50%)`;
    div.dataset.hue = hue;
    div.draggable = !fixed;

    div.addEventListener("dragstart", () => dragged = div);
    div.addEventListener("dragover", e => e.preventDefault());

    div.addEventListener("drop", () => {

      if (div !== dragged && !div.classList.contains("fixed")) {

        let tempHue = div.dataset.hue;

        div.dataset.hue = dragged.dataset.hue;
        dragged.dataset.hue = tempHue;

        div.style.background = `hsl(${div.dataset.hue},100%,50%)`;
        dragged.style.background = `hsl(${dragged.dataset.hue},100%,50%)`;

      }
    });

    return div;
  }

  row.appendChild(createColor(first, true));
  middle.forEach(h => row.appendChild(createColor(h)));
  row.appendChild(createColor(last, true));

  return { row, hues };
}

starts.forEach(h => {
  let r = createRow(h);
  rowsData.push(r);
  testDiv.appendChild(r.row);
});

function check() {

  let lieu = document.getElementById("lieu").value;

  if (!lieu) {
    alert("Veuillez sélectionner un lieu");
    return;
  }

  let score = 0;
  let total = 0;

  rowsData.forEach(r => {

    let items = r.row.querySelectorAll(".color");

    items.forEach((el, i) => {

      let hue = parseInt(el.dataset.hue);
      total++;

      if (Math.abs(hue - r.hues[i]) < 5) score++;

    });
  });

  let percent = Math.round((score / total) * 100);
  lastScore = percent;

  let result = percent + "%";
  if (percent >= 90) result += " ✅ Conforme";
  else result += " ❌ Non conforme";

  document.getElementById("result").innerText = result;

  sendToExcel(percent);
}

function sendToExcel(score){

  let now = new Date();

  let data = {
    nom: document.getElementById("nom").value,
    prenom: document.getElementById("prenom").value,
    score: score,
    date: now.toLocaleDateString(),
    heure: now.toLocaleTimeString(),
    lieu: document.getElementById("lieu").value
  };

  fetch("https://script.google.com/macros/s/AKfycbyzJ8WPtFQW-I8oK1HgJSHEmXnh9Cpz28FIpMBs57ivSUMQTQelxbMgVYiflnbSdvo6/exec", {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(data)
  });

}

</script>

</body>
</html>
