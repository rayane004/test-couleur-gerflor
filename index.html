<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test Farnsworth - GERFLOR</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  margin: 0;
  background: linear-gradient(120deg, #eef3f9, #dde6f2);
}

header {
  background: linear-gradient(90deg, #002b5c, #0051a8);
  color: white;
  text-align: center;
  padding: 25px;
}

header img {
  height: 50px;
  margin-bottom: 10px;
}

.container {
  max-width: 1100px;
  margin: 40px auto;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.description {
  text-align: center;
  margin-bottom: 20px;
  color: #444;
}

.row {
  display: flex;
  justify-content: center;
  margin: 12px 0;
}

.color {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  margin: 4px;
  cursor: grab;
}

.fixed {
  border: 3px solid black;
  cursor: default;
}

input {
  padding: 12px;
  margin: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-top: 15px;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(90deg, #002b5c, #0051a8);
  color: white;
  cursor: pointer;
}

#result {
  margin-top: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <!-- ✅ LOGO EN LIGNE -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Gerflor_logo.svg">
  <h1>Test de perception des couleurs</h1>
</header>

<div class="container">
<div class="card">

<p class="description">
Réorganisez les pastilles pour reconstituer un dégradé cohérent.
</p>

<div id="test"></div>

<div style="text-align:center;">
  <input id="nom" placeholder="Nom">
  <input id="prenom" placeholder="Prénom">
</div>

<div style="text-align:center;">
  <button onclick="check()">Valider</button>
</div>

<div id="result"></div>

</div>
</div>

<script>
let rowsData = [];
let dragged;
let lastScore = 0;

let testDiv = document.getElementById("test");

let starts = [0, 72, 144, 216, 288];

function createRow(startHue) {

  let row = document.createElement("div");
  row.className = "row";

  let hues = [];

  for (let i = 0; i < 20; i++) {
    hues.push((startHue + i * 3) % 360);
  }

  let first = hues[0];
  let last = hues[hues.length - 1];

  let middle = hues.slice(1, -1).sort(() => Math.random() - 0.5);

  function createColor(hue, fixed = false) {

    let div = document.createElement("div");
    div.className = "color";

    if (fixed) div.classList.add("fixed");

    div.style.background = `hsl(${hue},100%,50%)`;
    div.dataset.hue = hue;
    div.draggable = !fixed;

    div.addEventListener("dragstart", () => dragged = div);
    div.addEventListener("dragover", e => e.preventDefault());

    div.addEventListener("drop", () => {
      if (div !== dragged && !div.classList.contains("fixed")) {

        let temp = div.style.background;
        let tempHue = div.dataset.hue;

        div.style.background = dragged.style.background;
        div.dataset.hue = dragged.dataset.hue;

        dragged.style.background = temp;
        dragged.dataset.hue = tempHue;
      }
    });

    return div;
  }

  row.appendChild(createColor(first, true));
  middle.forEach(h => row.appendChild(createColor(h)));
  row.appendChild(createColor(last, true));

  return { row, hues };
}

starts.forEach(h => {
  let r = createRow(h);
  rowsData.push(r);
  testDiv.appendChild(r.row);
});

function check() {

  let score = 0;
  let total = 0;

  rowsData.forEach(r => {
    let items = r.row.querySelectorAll(".color");

    items.forEach((el, i) => {
      let hue = parseInt(el.dataset.hue);
      total++;

      if (Math.abs(hue - r.hues[i]) < 5) score++;
    });
  });

  let percent = Math.round((score / total) * 100);
  lastScore = percent;

  let result = percent + "%";
  if (percent >= 90) result += " ✅ Conforme";
  else result += " ❌ Non conforme";

  document.getElementById("result").innerText = result;

  sendToExcel(percent);
}

/* ✅ ENVOI VERS TON EXCEL */
function sendToExcel(score){

  let now = new Date();

  let data = {
    nom: document.getElementById("nom").value,
    prenom: document.getElementById("prenom").value,
    score: score,
    date: now.toLocaleDateString(),
    heure: now.toLocaleTimeString(),
    lieu: "Usine Gerflor"
  };

fetch("https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnRbVCGLbjBOvh0IuBbALke2FNEiT7Zsw5Vddo_AMTSX70Eima2FVRdPtQ_yoOV_XxvZa-ETF4DJyrr1LSfvS2b6SUoJbY8_VL8mh7tasjdpW9j3knfAJrinubbykDvfN_ywX2lu9ayPKBaoGC9dTXduO9ZFbIe_OBFtt59JTHsusu3lbn5j104n2NstlleK6xdT2V0p_0zYJSUuFs2Pr9iADf-2EpfRVTjn1Fw8uAfJbDMxoZt_BB2QVWX-wvNu6J5SW7Hzs1XspHNEIBw421CnPZZi3A&lib=M9CCRG_6FKY-UIBu6ebALMKKr128tNxL1", {
  method: "POST",
  mode: "no-cors",
  body: JSON.stringify(data)
});

}
</script>

</body>
</html>
